name: Deploy Status API to OCI

on:
  push:
    branches:
      - main
    paths:
      - "services/status-api/**"
      - "deploy/status-api/**"
      - "scripts/configure-caddy-status-api.sh"
      - "scripts/deploy-status-api-oci.sh"
      - ".github/workflows/deploy-status-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-ivrm-status-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.event_name == 'workflow_dispatch' || vars.STATUS_API_AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/status-api/requirements-dev.txt

      - name: Test status API
        working-directory: services/status-api
        run: |
          python -m pip install --requirement requirements-dev.txt
          pytest

      - name: Set up OCI host Python baseline
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - name: Validate collector on Python 3.9
        run: |
          python --version
          python -m py_compile deploy/status-api/collect-minecraft-runtime.py
          python deploy/status-api/collect-minecraft-runtime.py --help >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR on runner
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/status-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/ivrooom/ivrm-stats-api:${{ github.sha }}
            ghcr.io/ivrooom/ivrm-stats-api:latest
          cache-from: type=gha,scope=ivrm-stats-api
          cache-to: type=gha,mode=max,scope=ivrm-stats-api

      - name: Configure SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package deployment files
        run: |
          tar -czf /tmp/ivrm-status-api-deploy.tar.gz \
            deploy/status-api \
            scripts/configure-caddy-status-api.sh \
            scripts/deploy-status-api-oci.sh

      - name: Upload deployment files
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          scp /tmp/ivrm-status-api-deploy.tar.gz \
            "${OCI_USER}@${OCI_HOST}:/tmp/ivrm-status-api-deploy.tar.gz"

      - name: Log in to GHCR on OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh "${OCI_USER}@${OCI_HOST}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy on OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh "${OCI_USER}@${OCI_HOST}" "IMAGE_TAG='${IMAGE_TAG}' bash -s" <<'REMOTE'
            set -Eeuo pipefail
            RELEASE_DIR="$(mktemp -d)"
            trap 'rm -rf "$RELEASE_DIR" /tmp/ivrm-status-api-deploy.tar.gz; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            tar -xzf /tmp/ivrm-status-api-deploy.tar.gz -C "$RELEASE_DIR"
            cd "$RELEASE_DIR"
            bash scripts/deploy-status-api-oci.sh "$IMAGE_TAG"
          REMOTE

      - name: Production smoke test
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -u
          response_file="$(mktemp)"
          headers_file="$(mktemp)"
          trap 'rm -f "$response_file" "$headers_file"' EXIT

          for attempt in 1 2 3 4 5; do
            url="https://status.ivrm.jp/api/status.json?deploy=${DEPLOY_SHA}-${attempt}"
            http_code="$(curl --silent --show-error --max-time 15 \
              --header 'Cache-Control: no-cache' \
              --dump-header "$headers_file" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$url" || true)"

            echo "Public smoke test attempt ${attempt}: HTTP ${http_code:-curl-error}"
            if [[ "$http_code" == "200" ]] \
              && python3 -c 'import json,sys; data=json.load(sys.stdin); ids={s["id"] for s in data["services"]}; assert "minecraft-network" in ids and "herta-discord-bot" in ids' <"$response_file"; then
              exit 0
            fi
            sleep 5
          done

          echo "Public endpoint did not return the integrated Status API." >&2
          echo "Final response headers:" >&2
          sed -n '1,40p' "$headers_file" >&2 || true
          echo "Final response body (first 500 bytes):" >&2
          head -c 500 "$response_file" >&2 || true
          echo >&2
          exit 1
