name: Deploy to OCI

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "history/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/deploy-oci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-stats-ivrm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        run: |
          python3 scripts/validate.py
          node --check assets/page-load-guard.js
          node scripts/test-page-load-guard.mjs
          node --check assets/api-fetch-guard.js
          node scripts/test-api-fetch-guard.mjs
          node --check assets/app.js
          node --check assets/history.js
          node --check assets/status-presentation.js
          node --check assets/minecraft-servers.js
          node scripts/test-status-portal-core.mjs
          bash -n scripts/deploy-oci.sh
          bash -n scripts/rollback-oci.sh

      - name: Stamp release asset versions
        env:
          RELEASE_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          for relative in ("index.html", "history/index.html"):
              path = Path(relative)
              source = path.read_text(encoding="utf-8")
              updated, count = re.subn(
                  r'(/assets/[^?"]+\?v=)[^"]+',
                  lambda match: f"{match.group(1)}{version}",
                  source,
              )
              if count == 0:
                  raise SystemExit(f"No versioned assets found in {relative}")
              path.write_text(updated, encoding="utf-8")
              print(f"Stamped {count} assets in {relative} with {version}")
          PY
          grep -F "/assets/minecraft-servers.js?v=${RELEASE_VERSION}" index.html
          grep -F "/assets/app.js?v=${RELEASE_VERSION}" index.html

      - name: Configure SSH
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$OCI_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package release
        run: |
          tar -czf /tmp/ivrm-stats-release.tar.gz \
            index.html history assets \
            scripts/validate.py scripts/test-api-fetch-guard.mjs \
            scripts/test-page-load-guard.mjs scripts/test-status-portal-core.mjs \
            scripts/deploy-oci.sh scripts/rollback-oci.sh \
            deploy/status-api/collect-minecraft-runtime.py \
            deploy/status-api/ivrm-minecraft-runtime-collector.service \
            deploy/status-api/ivrm-minecraft-runtime-collector.timer

      - name: Validate release package
        run: |
          RELEASE_CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$RELEASE_CHECK_DIR"' EXIT
          tar -xzf /tmp/ivrm-stats-release.tar.gz -C "$RELEASE_CHECK_DIR"
          cd "$RELEASE_CHECK_DIR"
          python3 scripts/validate.py
          node --check assets/page-load-guard.js
          node scripts/test-page-load-guard.mjs
          node --check assets/api-fetch-guard.js
          node scripts/test-api-fetch-guard.mjs
          node --check assets/app.js
          node --check assets/history.js
          node --check assets/status-presentation.js
          node --check assets/minecraft-servers.js
          node scripts/test-status-portal-core.mjs
          bash -n scripts/deploy-oci.sh
          bash -n scripts/rollback-oci.sh

      - name: Upload release files
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          scp /tmp/ivrm-stats-release.tar.gz \
            "${OCI_USER}@${OCI_HOST}:/tmp/ivrm-stats-release.tar.gz"

      - name: Deploy on OCI
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh "${OCI_USER}@${OCI_HOST}" <<'REMOTE'
            set -Eeuo pipefail
            RELEASE_DIR="$(mktemp -d)"
            trap 'rm -rf "$RELEASE_DIR" /tmp/ivrm-stats-release.tar.gz' EXIT
            tar -xzf /tmp/ivrm-stats-release.tar.gz -C "$RELEASE_DIR"
            cd "$RELEASE_DIR"
            bash ./scripts/deploy-oci.sh
          REMOTE

      - name: Production smoke test
        run: |
          for attempt in 1 2 3 4 5; do
            PAGE="$(curl --fail --silent --show-error --max-time 15 \
              "https://status.ivrm.jp/?deploy=${GITHUB_SHA}")" || true
            MINECRAFT_SCRIPT="$(curl --fail --silent --show-error --max-time 15 \
              "https://status.ivrm.jp/assets/minecraft-servers.js?v=${GITHUB_SHA}")" || true
            if printf '%s' "$PAGE" | grep -Fq "/assets/page-load-guard.js?v=${GITHUB_SHA}" \
              && printf '%s' "$PAGE" | grep -Fq "/assets/app.js?v=${GITHUB_SHA}" \
              && printf '%s' "$PAGE" | grep -Fq "/assets/minecraft-servers.js?v=${GITHUB_SHA}" \
              && printf '%s' "$MINECRAFT_SCRIPT" | grep -q 'function mutationAddsServiceRow' \
              && printf '%s' "$MINECRAFT_SCRIPT" | grep -q 'setTextIfChanged' \
              && curl --fail --silent --show-error --max-time 15 \
                "https://status.ivrm.jp/assets/page-load-guard.js?v=${GITHUB_SHA}" >/dev/null \
              && curl --fail --silent --show-error --max-time 15 \
                "https://status.ivrm.jp/assets/app.js?v=${GITHUB_SHA}" >/dev/null \
              && curl --fail --silent --show-error --max-time 15 \
                "https://status.ivrm.jp/history/?deploy=${GITHUB_SHA}" >/dev/null \
              && curl --fail --silent --show-error --max-time 15 \
                "https://status.ivrm.jp/api/status.json?deploy=${GITHUB_SHA}" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
