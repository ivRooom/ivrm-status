name: UI Quality Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static dashboard
        run: |
          python3 scripts/validate.py
          node --check assets/app.js
          node --check assets/status-presentation.js
          node --check assets/status-portal-core.js
          node --check assets/history.js
          node --check assets/history-portal.js

      - name: Test Status Portal helpers
        run: node scripts/test-status-portal-core.mjs

      - name: Verify deployment scripts
        run: |
          bash -n scripts/deploy-oci.sh
          bash -n scripts/rollback-oci.sh
