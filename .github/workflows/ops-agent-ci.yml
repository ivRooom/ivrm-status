name: Ops Agent Quality Check

on:
  pull_request:
    paths:
      - "services/ops-agent/**"
      - ".github/workflows/ops-agent-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/ops-agent/**"
      - ".github/workflows/ops-agent-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ops-agent
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ops-agent/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test (Bedrock is faked; no AWS access)
        run: pytest

  ai-draft-actor-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test the AI draft actor migration (throwaway Postgres, no real database)
        run: bash services/ops-agent/supabase/test-ai-draft-actor.sh
