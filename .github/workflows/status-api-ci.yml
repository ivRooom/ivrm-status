name: Status API Quality Check

on:
  pull_request:
    paths:
      - "services/status-api/**"
      - "deploy/status-api/**"
      - "scripts/configure-caddy-status-api.sh"
      - "scripts/deploy-status-api-oci.sh"
      - "scripts/send-test-status.py"
      - ".github/workflows/status-api-ci.yml"
      - ".github/workflows/deploy-status-api.yml"
  push:
    branches:
      - main
    paths:
      - "services/status-api/**"
      - "deploy/status-api/**"
      - "scripts/configure-caddy-status-api.sh"
      - "scripts/deploy-status-api-oci.sh"
      - "scripts/send-test-status.py"
      - ".github/workflows/status-api-ci.yml"
      - ".github/workflows/deploy-status-api.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/status-api
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/status-api/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Show dependency versions
        run: |
          python --version
          python -c "import fastapi,httpx,pydantic,pytest,uvicorn; print('fastapi', fastapi.__version__); print('httpx', httpx.__version__); print('pydantic', pydantic.__version__); print('pytest', pytest.__version__); print('uvicorn', uvicorn.__version__)"

      - name: Compile application
        run: python -m compileall -q app tests

      - name: Run tests
        shell: bash
        run: |
          set +e
          pytest -vv --tb=short --junitxml=pytest-results.xml > pytest-output.txt 2>&1
          status=$?
          if [[ $status -eq 0 ]]; then
            tail -n 30 pytest-output.txt
          else
            echo "=== pytest failure summary ==="
            tail -n 120 pytest-output.txt
          fi
          exit "$status"

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: status-api-pytest-diagnostics
          path: |
            ${{ github.workspace }}/services/status-api/pytest-output.txt
            ${{ github.workspace }}/services/status-api/pytest-results.xml
          if-no-files-found: error
          retention-days: 7

      - name: Validate deployment scripts
        working-directory: .
        run: |
          bash -n scripts/configure-caddy-status-api.sh
          bash -n scripts/deploy-status-api-oci.sh
          python3 -m py_compile scripts/send-test-status.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build linux/arm64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/status-api/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=ivrm-stats-api
          cache-to: type=gha,mode=max,scope=ivrm-stats-api
