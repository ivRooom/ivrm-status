name: Ops Gate Quality Check

on:
  pull_request:
    paths:
      - "services/ops-gate/**"
      - ".github/workflows/ops-gate-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/ops-gate/**"
      - ".github/workflows/ops-gate-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ops-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/ops-gate/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Test
        run: pytest

      - name: Shell script syntax
        run: sh -n run.sh
